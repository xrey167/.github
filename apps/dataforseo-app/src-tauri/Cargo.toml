[package]
name = "dataforseo-app"
version = "0.1.0"
description = "Lokale Tauri-App als UI-Layer über DataForSEO."
edition = "2021"
rust-version = "1.77"

[lib]
name = "dataforseo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# Auto-updater plugins. Optional deps so default builds don't require the
# release-signing infrastructure. Enable with `--features updater` once
# TAURI_PRIVATE_KEY + the GitHub-Releases update feed are provisioned
# (see docs/AUTOUPDATE.md). plugin-process gives the JS side `relaunch()`
# so the app restarts itself after downloadAndInstall().
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

duckdb = { version = "1", features = ["bundled", "chrono"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
keyring = "3"

ts-rs = { version = "10", features = ["serde-json-impl"] }
printpdf = { version = "0.7", default-features = false }

[dev-dependencies]
proptest = "1"
wiremock = "0.6"
tokio = { version = "1", features = ["full", "test-util"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Auto-updater. Off by default — requires release infrastructure
# (signing key + signed-release feed). See docs/AUTOUPDATE.md.
updater = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process"]
