name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate-pr:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check PR title format
        id: pr-title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Accepted formats:
          #   [TYPE] description           (legacy)
          #   TYPE: description            (legacy uppercase)
          #   type: description            (conventional commits)
          #   type(scope): description     (conventional commits with scope)
          # The leading word is at least 2 letters so single-letter typos
          # are still flagged. Title is read from env (not interpolated)
          # to avoid script injection via crafted titles.
          if [[ "$PR_TITLE" =~ ^(\[[A-Za-z]+\][[:space:]]+|[A-Za-z]{2,}(\([^)]+\))?:[[:space:]]+).+ ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "PR title follows convention: $PR_TITLE"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "PR title does not follow convention."
            echo "Expected: '[TYPE] desc', 'TYPE: desc', or 'type(scope): desc'"
            echo "Got: $PR_TITLE"
            exit 1
          fi

      - name: Check for linked issues
        id: linked-issues
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Advisory only — many PRs (feature work, refactors) don't tie
          # to a tracked issue. Surface the recommendation but never fail.
          if [[ "$PR_BODY" =~ (Closes|Fixes|Resolves|Related|Ref).*#[0-9]+ ]] || \
             [[ "$PR_BODY" =~ https://github.com/.*/issues/[0-9]+ ]]; then
            echo "linked=true" >> "$GITHUB_OUTPUT"
            echo "PR is linked to issue(s)."
          else
            echo "linked=false" >> "$GITHUB_OUTPUT"
            echo "No linked issues found (advisory)."
          fi

      - name: Check PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$PR_BODY" ] || [ ${#PR_BODY} -lt 50 ]; then
            echo "PR description is short or empty (advisory)."
          else
            echo "PR description looks good."
          fi

      - name: Comment PR validation results
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = `## 🔍 PR Validation Results

            ❌ Some validation checks failed. Please address the following:

            ### PR Title
            - Expected format: \`[TYPE] Description\` or \`TYPE: Description\`
            - Examples: \`[FEATURE] Add user authentication\`, \`BUG: Fix login error\`

            ### Linked Issues
            - Please link related issues using: \`Closes #123\`, \`Fixes #456\`, or \`Related #789\`

            ### Description
            - Provide a clear description of what changes were made and why

            ---
            *This is an automated check. See [PR Guidelines](.github/pull_request_template.md) for more information.*`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

  pr-size-check:
    name: Check PR Size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR size
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          STATS=$(git diff --shortstat "origin/$BASE_REF...HEAD")
          CHANGED_LINES=$(echo "$STATS" | grep -Eo '[0-9]+ insertion' | grep -Eo '[0-9]+' || echo 0)
          DELETED_LINES=$(echo "$STATS" | grep -Eo '[0-9]+ deletion'  | grep -Eo '[0-9]+' || echo 0)
          TOTAL_CHANGES=$((CHANGED_LINES + DELETED_LINES))

          echo "PR statistics:"
          echo "- Insertions: $CHANGED_LINES"
          echo "- Deletions:  $DELETED_LINES"
          echo "- Total:      $TOTAL_CHANGES"

          # Advisory only. Stacked-PR feature work routinely lands at
          # >1k LOC; auto-failing every such PR was just noise that the
          # team learned to ignore. Surface size + a hint, never block.
          if [ "$TOTAL_CHANGES" -gt 5000 ]; then
            echo "::warning::Very large PR ($TOTAL_CHANGES lines). Consider splitting if reviewable in chunks."
          elif [ "$TOTAL_CHANGES" -gt 1000 ]; then
            echo "::notice::Large PR ($TOTAL_CHANGES lines)."
          else
            echo "PR size is small."
          fi

  review-checklist:
    name: Post Review Checklist
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    steps:
      - name: Post review checklist comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = `## 👀 Review Checklist

            ### For Reviewers

            - [ ] Code follows project conventions and style guides
            - [ ] Changes are well-documented
            - [ ] Tests are included and passing
            - [ ] No obvious security vulnerabilities
            - [ ] Performance implications considered
            - [ ] Breaking changes are documented
            - [ ] Edge cases are handled

            ### For Agent-Generated Code

            - [ ] AI-generated code is reviewed by human
            - [ ] Code makes logical sense in context
            - [ ] No hardcoded values or magic numbers
            - [ ] Error handling is appropriate
            - [ ] Code is maintainable and readable

            ---
            *Check off items as you review. This helps ensure thorough code review.*`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

  conflict-check:
    name: Check for Merge Conflicts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for conflicts
        run: |
          git fetch origin ${{ github.base_ref }}
          
          # Try to merge (dry-run)
          if git merge-tree $(git merge-base HEAD origin/${{ github.base_ref }}) HEAD origin/${{ github.base_ref }} | grep -q '<<<<<<<'; then
            echo "❌ Merge conflicts detected"
            echo "Please resolve conflicts with base branch"
            exit 1
          else
            echo "✅ No merge conflicts detected"
          fi

  label-check:
    name: Check Labels
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR has labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const labels = pullRequest.labels.map(l => l.name);
            
            if (labels.length === 0) {
              core.warning('⚠️  PR has no labels. Consider adding labels for better organization.');
            } else {
              core.info(`✅ PR has ${labels.length} label(s): ${labels.join(', ')}`);
            }
