name: DataForSEO App CI

on:
  pull_request:
    paths:
      - "apps/dataforseo-app/**"
  push:
    branches:
      - main
    paths:
      - "apps/dataforseo-app/**"

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/dataforseo-app

jobs:
  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/dataforseo-app/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run --reporter=verbose

  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps for tauri webview
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/dataforseo-app/src-tauri
      - name: rustfmt
        working-directory: apps/dataforseo-app/src-tauri
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: apps/dataforseo-app/src-tauri
        # -D warnings is too aggressive given how much wiring this app
        # has; we keep it as -W and read the report instead. Tighten
        # post-Phase-D1 (test suite up).
        run: cargo clippy --workspace --all-targets -- -W warnings
      - name: cargo test
        working-directory: apps/dataforseo-app/src-tauri
        run: cargo test --workspace --no-fail-fast

  build-smoke:
    name: Tauri build smoke
    runs-on: ubuntu-latest
    needs: [frontend, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/dataforseo-app/package-lock.json
      - name: Install system deps for tauri webview
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/dataforseo-app/src-tauri
      - name: Install npm
        run: npm ci || npm install
      - name: Vite build
        run: npm run build
      - name: Cargo check (lib only — full build requires icon assets)
        working-directory: apps/dataforseo-app/src-tauri
        run: cargo check --lib
