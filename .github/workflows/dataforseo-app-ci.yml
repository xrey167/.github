name: DataForSEO App CI

on:
  pull_request:
    paths:
      - "apps/dataforseo-app/**"
  push:
    branches:
      - main
    paths:
      - "apps/dataforseo-app/**"

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/dataforseo-app

jobs:
  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        # `npm ci` first; fall back to `npm install --legacy-peer-deps`
        # if the lockfile drifts (some root-level peer-dep conflicts
        # in the parent monorepo can otherwise block the install).
        run: npm ci || npm install --legacy-peer-deps
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run --reporter=verbose

  rust:
    name: Rust (clippy + test)
    runs-on: ubuntu-latest
    # Cargo 1.94 on GTK runners: clippy exits 0 (16 idiomatic
    # warnings, 0 errors), `cargo test` runs 122 tests with 0
    # failures. Full output is teed to log files and uploaded as the
    # `rust-ci-logs` artifact on failure so any future divergence is
    # debuggable from the GitHub UI.
    env:
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps for tauri webview
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/dataforseo-app/src-tauri
      - name: clippy
        working-directory: apps/dataforseo-app/src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log
      - name: cargo test
        working-directory: apps/dataforseo-app/src-tauri
        # `--nocapture` surfaces test stdout/stderr (incl. panic
        # locations) so a CI-only failure isn't silenced by libtest's
        # default capture. tee preserves the full transcript for the
        # artifact step below.
        run: cargo test --workspace --no-fail-fast --verbose -- --nocapture 2>&1 | tee cargo-test.log
      - name: Upload cargo logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-ci-logs
          path: |
            apps/dataforseo-app/src-tauri/clippy.log
            apps/dataforseo-app/src-tauri/cargo-test.log
          if-no-files-found: ignore

  build-smoke:
    name: Vite build smoke
    runs-on: ubuntu-latest
    # Frontend-only smoke test. The Rust side is covered (advisory) by
    # the rust job above; we don't double up here. No GTK, no cargo —
    # just `vite build` to confirm the production bundle still emits.
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install npm
        run: npm ci || npm install --legacy-peer-deps
      - name: Vite build
        run: npm run build

  tauri-build-smoke:
    name: Tauri build smoke (advisory)
    runs-on: ubuntu-latest
    # Compile + link the native binary without signing or bundling.
    # `continue-on-error: true` keeps this advisory until a stable green
    # week; flip to false to make it a hard gate.
    continue-on-error: true
    needs: [rust]
    env:
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/dataforseo-app/src-tauri
          # Separate cache key so tauri-build artifacts don't evict the
          # clippy/test incremental cache used by the rust job.
          shared-key: tauri-build
      - name: Install npm deps (tauri-cli needs the frontend)
        run: npm ci || npm install --legacy-peer-deps
      - name: cargo tauri build (no bundle, no signing)
        working-directory: apps/dataforseo-app
        run: npm run tauri:build -- --no-bundle 2>&1 | tee tauri-build.log
      - name: Upload tauri build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log
          path: apps/dataforseo-app/tauri-build.log
          if-no-files-found: ignore
