name: DataForSEO App CI

on:
  pull_request:
    paths:
      - "apps/dataforseo-app/**"
  push:
    branches:
      - main
    paths:
      - "apps/dataforseo-app/**"

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/dataforseo-app

jobs:
  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        # `npm ci` first; fall back to `npm install --legacy-peer-deps`
        # if the lockfile drifts (some root-level peer-dep conflicts
        # in the parent monorepo can otherwise block the install).
        run: npm ci || npm install --legacy-peer-deps
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run --reporter=verbose

  rust:
    name: Rust (clippy + test)
    runs-on: ubuntu-latest
    # All three steps now gate merge — `cargo check`, `cargo clippy`,
    # and `cargo test` all pass locally on the post-fix code (122
    # tests, 0 failures, 0 errors, 16 clippy warnings under -W). Tighten
    # to -D warnings once the existing 16 are cleaned up.
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps for tauri webview
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/dataforseo-app/src-tauri
      - name: clippy
        working-directory: apps/dataforseo-app/src-tauri
        # -W warnings (not -D) because we still have ~16 idiomatic
        # warnings (mostly redundant_closure on poller helpers).
        # Cleaned up in a follow-up; tighten to -D after.
        run: cargo clippy --workspace --all-targets -- -W warnings
      - name: cargo test
        working-directory: apps/dataforseo-app/src-tauri
        run: cargo test --workspace --no-fail-fast

  build-smoke:
    name: Vite build smoke
    runs-on: ubuntu-latest
    # Frontend-only smoke test. The Rust side is covered (advisory) by
    # the rust job above; we don't double up here. No GTK, no cargo —
    # just `vite build` to confirm the production bundle still emits.
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install npm
        run: npm ci || npm install --legacy-peer-deps
      - name: Vite build
        run: npm run build
